<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1780" font-family="Arial, Helvetica, sans-serif">
  <style>
    .h1 { font: bold 32px Arial; fill: #111; }
    .h2 { font: bold 22px Arial; fill: #004488; }
    .h3 { font: bold 18px Arial; fill: #222; }
    .t  { font: 17px Arial; fill: #111; }
    .ts { font: 15px Arial; fill: #444; }
    .box { fill: #eef4ff; stroke: #224; stroke-width: 3; }
    .box-y { fill: #fff8e0; stroke: #886600; stroke-width: 3; stroke-dasharray: 12 8; }
    .box-g { fill: #eefaf0; stroke: #264; stroke-width: 3; }
    .box-p { fill: #f8f0ff; stroke: #663399; stroke-width: 2; stroke-dasharray: 8 6; }
    .arr { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#a); }
    .arr-t { font: bold 15px Arial; fill: #0066aa; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1200" height="1780" fill="#fff"/>

  <text x="600" y="48" text-anchor="middle" class="h1">Czujnik poziomu tanku</text>
  <text x="600" y="78" text-anchor="middle" class="ts">Schemat blokowy - ESP32 DevKit V1 + 18650 (prototyp aktywny) | 2026-09</text>
  <text x="600" y="102" text-anchor="middle" class="ts">English: tank-overview.en.svg</text>

  <text x="60" y="140" class="h2">1. Zasilanie</text>

  <rect x="60" y="160" width="200" height="90" rx="8" class="box"/>
  <text x="160" y="195" text-anchor="middle" class="h3">BT1</text>
  <text x="160" y="220" text-anchor="middle" class="t">18650 Li-ion</text>
  <text x="160" y="242" text-anchor="middle" class="ts">BAT+ / GND</text>

  <rect x="300" y="160" width="240" height="90" rx="8" class="box-p"/>
  <text x="420" y="192" text-anchor="middle" class="h3">TP4056 (plan)</text>
  <text x="420" y="217" text-anchor="middle" class="t">Panel USB 5 V</text>
  <text x="420" y="239" text-anchor="middle" class="ts">ladowanie - niepodlaczone</text>

  <rect x="580" y="160" width="300" height="90" rx="8" class="box"/>
  <text x="730" y="192" text-anchor="middle" class="h3">ESP32 DevKit V1</text>
  <text x="730" y="217" text-anchor="middle" class="t">+ expansion board 38P</text>
  <text x="730" y="239" text-anchor="middle" class="ts">5V/VIN z MT3608 OUT+</text>

  <line x1="260" y1="205" x2="300" y2="205" class="arr"/>
  <text x="262" y="190" class="arr-t">BAT+</text>
  <line x1="540" y1="205" x2="580" y2="205" class="arr"/>
  <text x="500" y="190" class="arr-t">OUT+ 5V</text>

  <text x="60" y="280" class="ts">USB DevKit tylko do flash. Nie zasilaj ESP rownolegle z USB i MT3608 OUT+.</text>

  <text x="60" y="320" class="h2">2. MT3608 + MOSFET (stykowka)</text>
  <rect x="60" y="340" width="1080" height="210" rx="10" class="box-y"/>
  <text x="600" y="365" text-anchor="middle" class="ts">C1, U2 MT3608, Q1 IRLZ44N, R3, C2 - wspolna GND</text>

  <rect x="90" y="390" width="110" height="65" rx="6" class="box-g"/>
  <text x="145" y="418" text-anchor="middle" class="t">BAT+</text>
  <text x="145" y="440" text-anchor="middle" class="ts">szyna</text>

  <rect x="230" y="390" width="90" height="65" rx="6" class="box"/>
  <text x="275" y="425" text-anchor="middle" class="t">C1</text>
  <text x="275" y="445" text-anchor="middle" class="ts">1000uF</text>

  <rect x="350" y="380" width="130" height="85" rx="6" class="box"/>
  <text x="415" y="415" text-anchor="middle" class="h3">MT3608</text>
  <text x="415" y="440" text-anchor="middle" class="ts">IN+ IN- OUT+ OUT-</text>

  <rect x="510" y="390" width="110" height="65" rx="6" class="box"/>
  <text x="565" y="418" text-anchor="middle" class="t">Q1</text>
  <text x="565" y="440" text-anchor="middle" class="ts">IRLZ44N</text>

  <rect x="650" y="390" width="100" height="65" rx="6" class="box-g"/>
  <text x="700" y="425" text-anchor="middle" class="t">+5V</text>

  <rect x="780" y="390" width="90" height="65" rx="6" class="box"/>
  <text x="825" y="425" text-anchor="middle" class="t">C2</text>
  <text x="825" y="445" text-anchor="middle" class="ts">100nF</text>

  <rect x="900" y="390" width="210" height="65" rx="6" class="box"/>
  <text x="1005" y="418" text-anchor="middle" class="t">ESP 5V + JSN VCC</text>

  <line x1="200" y1="422" x2="230" y2="422" class="arr"/>
  <line x1="320" y1="422" x2="350" y2="422" class="arr"/>
  <line x1="480" y1="422" x2="510" y2="422" class="arr"/>
  <line x1="620" y1="422" x2="650" y2="422" class="arr"/>
  <line x1="750" y1="422" x2="780" y2="422" class="arr"/>
  <line x1="870" y1="422" x2="900" y2="422" class="arr"/>

  <text x="90" y="510" class="t">GPIO4 HIGH = Q1 ON = GND czujnika do masy. R3 10k: Gate -&gt; GND.</text>
  <text x="90" y="535" class="ts">MT3608 IN- i OUT- -&gt; GND. OUT+ ~5 V na VCC czujnika i ESP (gdy ogniwo podlaczone).</text>

  <text x="60" y="590" class="h2">3. JSN-SR04T-V3.3 (Mode 0)</text>

  <rect x="60" y="610" width="260" height="95" rx="8" class="box"/>
  <text x="190" y="645" text-anchor="middle" class="h3">ESP32 GPIO</text>
  <text x="190" y="672" text-anchor="middle" class="t">25=TRIG  26=ECHO</text>
  <text x="190" y="694" text-anchor="middle" class="t">4=POWER (Q1 Gate)</text>

  <rect x="360" y="610" width="200" height="95" rx="8" class="box"/>
  <text x="460" y="645" text-anchor="middle" class="h3">Dzielnik Echo</text>
  <text x="460" y="675" text-anchor="middle" class="t">R1 10k + R2 20k</text>
  <text x="460" y="697" text-anchor="middle" class="ts">5 V -&gt; ~3,3 V</text>

  <rect x="600" y="610" width="280" height="95" rx="8" class="box"/>
  <text x="740" y="645" text-anchor="middle" class="h3">JSN-SR04T</text>
  <text x="740" y="675" text-anchor="middle" class="t">VCC GND TRIG ECHO</text>
  <text x="740" y="697" text-anchor="middle" class="ts">GND przez Q1 Drain</text>

  <line x1="320" y1="657" x2="360" y2="657" class="arr"/>
  <text x="325" y="642" class="arr-t">GPIO25</text>
  <line x1="560" y1="657" x2="600" y2="657" class="arr"/>
  <text x="565" y="642" class="arr-t">ECHO</text>

  <text x="60" y="735" class="ts">MODE otwarty (bez mostka M1/M2/M3). Impuls Trig &gt;= 20 us w ESPHome.</text>

  <text x="60" y="780" class="h2">4. ADC baterii i wake</text>

  <rect x="60" y="800" width="520" height="95" rx="8" class="box"/>
  <text x="320" y="835" text-anchor="middle" class="h3">Dzielnik baterii (DevKit)</text>
  <text x="320" y="862" text-anchor="middle" class="t">BAT+ -[R5 100k]- GPIO34 -[R6 100k]- GND</text>
  <text x="320" y="884" text-anchor="middle" class="ts">battery_adc_multiplier w YAML (kalibracja miernikiem)</text>

  <rect x="620" y="800" width="520" height="95" rx="8" class="box-p"/>
  <text x="880" y="835" text-anchor="middle" class="h3">SW1 Wake (opcjonalnie)</text>
  <text x="880" y="862" text-anchor="middle" class="t">GPIO33 -[przycisk]- GND</text>
  <text x="880" y="884" text-anchor="middle" class="ts">wakeup_pin wylaczony w YAML bez przycisku</text>

  <text x="60" y="940" class="h2">5. Szybka tabela polaczen</text>
  <rect x="60" y="955" width="1080" height="420" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>

  <text x="80" y="990" class="h3">Zasilanie</text>
  <text x="80" y="1018" class="t">18650+  -&gt;  BAT+  -&gt;  MT3608 IN+, C1+, R5 (dzielnik)</text>
  <text x="80" y="1046" class="t">18650-  -&gt;  GND (wspolna masa)</text>
  <text x="80" y="1074" class="t">MT3608 OUT+  -&gt;  ESP 5V/VIN, C2, JSN VCC (~5,0 V)</text>

  <text x="80" y="1110" class="h3">MOSFET (low-side GND)</text>
  <text x="80" y="1138" class="t">JSN GND  -&gt;  Q1 Drain (pin 2)  |  Q1 Source (pin 3)  -&gt;  GND</text>
  <text x="80" y="1166" class="t">Q1 Gate (pin 1)  -&gt;  GPIO4 + R3 10k  -&gt;  GND</text>
  <text x="80" y="1194" class="ts">NIE: OUT+ na Drain Q1  |  NIE: Q1 na IN- MT3608</text>

  <text x="80" y="1230" class="h3">Czujnik</text>
  <text x="80" y="1258" class="t">GPIO25  -&gt;  TRIG  |  ECHO  -&gt;  R1  -&gt;  GPIO26  -&gt;  R2  -&gt;  GND</text>

  <text x="80" y="1294" class="h3">GPIO (DevKit)</text>
  <text x="80" y="1322" class="t">GPIO4 = sensor_power  |  GPIO25 = Trig  |  GPIO26 = Echo  |  GPIO34 = ADC baterii</text>
  <text x="80" y="1350" class="ts">GPIO16 nieuzywany (U2_RXD). GPIO33 wake - opcjonalnie.</text>

  <rect x="60" y="1400" width="1080" height="120" rx="8" fill="#fff0f0" stroke="#c44" stroke-width="2"/>
  <text x="80" y="1435" class="h3">Przed wlaczeniem</text>
  <text x="80" y="1465" class="t">Brak zwarcia BAT+ &lt;-&gt; GND. OUT+ MT3608 = ~5,0 V. C1: polaryzacja (+/-).</text>
  <text x="80" y="1495" class="t">Szczegoly: docs/schematics/connections-devkit.pl.md</text>

  <text x="1140" y="1765" text-anchor="end" class="ts">Rev. 3.0 DevKit + bateria</text>
</svg>
